# Chạy GitHub App: `cp .env.example .env`, điền biến, tải bộ luật Semgrep
# (`uv run python scripts/fetch_semgrep_rules.py --frozen`, ADR 0019), rồi `docker compose up --build`.
services:
  pr-triage:
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./data/app:/data
      # Bộ luật không nằm trong image (giấy phép không cho phân phối lại), gắn từ máy chủ.
      - ./data/rules:/app/data/rules:ro
    restart: unless-stopped
