name: pr-hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  naming:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Luồng nhánh
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$BASE" = "main" ] && [ "$HEAD" != "dev" ]; then
            echo "PR vào main chỉ được đến từ dev (nhánh hiện tại: $HEAD)"; exit 1
          fi
          if [ "$BASE" = "dev" ] && ! echo "$HEAD" | grep -Eq '^[a-z0-9]+/[a-z0-9-]+/[a-z0-9-]+$'; then
            echo "Nhánh phải theo {dev}/{slug}/{nội dung}, chữ thường, nối bằng gạch ngang: $HEAD"; exit 1
          fi
      - name: Tiêu đề PR theo Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|docs|refactor|test|chore|ci)(\([a-z0-9-]+\))?: .+' \
            || { echo "Tiêu đề phải dạng 'type(scope): mô tả': $TITLE"; exit 1; }
